name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: '0 2 * * 1'

jobs:
  # ============================================================
  # Job 1: PHP Lint & Composer Validate
  # ============================================================
  lint:
    name: PHP Lint (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax check (all project PHP files)
        # WHY: xargs -I{} fails when find returns 0 results. Use + form instead.
        run: |
          FILES=$(find . -name "*.php" \
            -not -path "*/vendor/*" \
            -not -path "*/web/wp/*" \
            -not -path "*/.git/*")
          if [ -z "$FILES" ]; then
            echo "No PHP files found."
          else
            echo "$FILES" | xargs php -l
          fi

      - name: PHP CodeSniffer
        # WHY: phpcs.xml must exist. Create a minimal ruleset if absent.
        run: |
          if [ ! -f phpcs.xml ] && [ ! -f phpcs.xml.dist ]; then
            cat > phpcs.xml << 'EOF'
          <?xml version="1.0"?>
          <ruleset name="iz-wp-lite">
            <description>iz-wp-lite coding standards</description>
            <file>web/app/mu-plugins</file>
            <file>config</file>
            <exclude-pattern>*/vendor/*</exclude-pattern>
            <exclude-pattern>*/web/wp/*</exclude-pattern>
            <rule ref="PSR2"/>
          </ruleset>
          EOF
          fi
          composer test

  # ============================================================
  # Job 2: WordPress Compatibility Matrix
  # ============================================================
  wp-compat:
    name: WP ${{ matrix.wp }} / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']
        wp: ['6.4', '6.5', '6.6']
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_DATABASE: wp_test
          MYSQL_USER: wp_user
          MYSQL_PASSWORD: wp_password
          MYSQL_RANDOM_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          extensions: pdo_mysql, mysqli, zip

      - name: Pin WordPress version to ${{ matrix.wp }}
        run: |
          composer require --no-update "roots/wordpress:^${{ matrix.wp }}"

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Copy and patch environment for CI
        run: |
          cp .env.example .env
          # Use | as sed delimiter to avoid escaping slashes in URLs
          sed -i 's|DB_NAME=.*|DB_NAME=wp_test|' .env
          sed -i 's|DB_USER=.*|DB_USER=wp_user|' .env
          sed -i 's|DB_PASSWORD=.*|DB_PASSWORD=wp_password|' .env
          sed -i 's|DB_HOST=.*|DB_HOST=127.0.0.1:3306|' .env
          sed -i 's|WP_HOME=.*|WP_HOME=http://localhost|' .env
          sed -i 's|WP_SITEURL=.*|WP_SITEURL=http://localhost/wp|' .env

      - name: Verify WordPress core files exist
        run: test -f web/wp/wp-settings.php

      - name: Check mu-plugins for PHP syntax errors
        # WHY: php -r with inline PHP calling shell_exec is fragile across
        # quoting layers. Run php -l directly via find instead.
        run: |
          find web/app/mu-plugins -name "*.php" | while read file; do
            php -l "$file" || exit 1
          done

  # ============================================================
  # Job 3: Docker Build Smoke Test
  # ============================================================
  docker-build:
    name: Docker Build (smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        # WHY: Build context is repo root (.), Dockerfile is at docker/Dockerfile.
        # This matches the docker-compose.yml context: .. configuration.
        run: docker build -f docker/Dockerfile -t iz-wp-lite:ci .

      - name: Validate Caddyfile syntax
        run: docker run --rm iz-wp-lite:ci caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Check PHP-FPM binary exists
        # WHY: Binary name on Alpine is 'php-fpm' not 'php-fpm8.3'.
        # Alpine php:8.3-fpm installs the binary as php-fpm in PATH.
        run: docker run --rm iz-wp-lite:ci php-fpm --test

  # ============================================================
  # Job 4: Security Audit
  # ============================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check for known vulnerabilities (composer audit)
        run: composer audit --no-dev

      - name: WPScan CVE check (WordPress core)
        # Requires WPSCAN_API_TOKEN secret set in GitHub repo settings.
        # Skip silently if token is not configured.
        env:
          WPSCAN_API_TOKEN: ${{ secrets.WPSCAN_API_TOKEN }}
        run: |
          if [ -z "${WPSCAN_API_TOKEN}" ]; then
            echo "Notice: WPSCAN_API_TOKEN is not configured. Skipping WPScan CVE check."
            exit 0
          fi
          WP_VERSION=$(python3 -c "
          import json, sys
          with open('composer.lock') as f:
            lock = json.load(f)
          for p in lock.get('packages', []):
            if p['name'] == 'roots/wordpress':
              print(p['version'])
              sys.exit(0)
          sys.exit(1)
          ")
          echo "Checking WP core version: $WP_VERSION"
          SLUG="${WP_VERSION//./}"
          curl -sf "https://wpscan.com/api/v3/wordpresses/${SLUG}" \
            -H "Authorization: Token token=${WPSCAN_API_TOKEN}" \
            -o response.json
          python3 - << 'PYEOF'
          import json, sys
          with open('response.json') as f:
            data = json.load(f)
          vulns = [v for block in data.values() for v in block.get('vulnerabilities', [])]
          if vulns:
            print(f"WARN: {len(vulns)} known vulnerabilities in WP core.")
            sys.exit(1)
          else:
            print("OK: No known vulnerabilities in WP core.")
          PYEOF
